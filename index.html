<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MH Companion Pro</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .panel {
            width: 100%;
            max-width: 800px;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        select, input[type="number"], button {
            padding: 8px;
            font-size: 14px;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
        }
        
        select { flex-grow: 1; min-width: 150px; }
        
        button {
            background-color: #2b78e4;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #1b5bb5; }
        
        .btn-danger { background-color: #c9302c; }
        .btn-danger:hover { background-color: #9f221f; }
        
        .btn-edit { background-color: #e69138; }
        .btn-edit:hover { background-color: #b46b21; }

        .btn-timedeck { background-color: #8e44ad; }
        .btn-timedeck:hover { background-color: #71368a; }

        .btn-active-tool {
            background-color: #27ae60 !important;
            box-shadow: 0 0 8px #2ecc71;
        }

        #edit-panel { display: none; background: #3a2a1a; border: 1px solid #e69138; }
        .edit-active #edit-panel { display: flex; }
        .edit-active #card-image { cursor: crosshair; }
        .instruction { width: 100%; color: #ffd966; font-size: 14px; text-align: center; font-weight: bold; }

        #card-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            user-select: none;
        }

        #card-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .zone {
            position: absolute;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4vw;
            font-weight: bold;
            color: white;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
            background: rgba(255, 255, 255, 0.15);
            border: 1px dashed rgba(255,255,255,0.5);
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        
        @media (min-width: 800px) { .zone { font-size: 32px; } }
        
        .edit-active .zone { background: rgba(230, 145, 56, 0.4); border: 2px dashed #e69138; }

        .hp-zone { 
            border-radius: 6px;
            background: #c9302c !important;
            border: 3px solid #ff6b6b;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
            font-size: 3.8vw;
        }
        @media (min-width: 800px) { .hp-zone { font-size: 30px; } }

        .token-stage-1 {
            background: #d97706 !important;
            border: 3px solid #fbbf24 !important;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
        }

        .token-stage-2 {
            background: #991b1b !important;
            border: 3px solid #f87171 !important;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            font-size: 7vw;
            font-weight: 900;
        }
        @media (min-width: 800px) { .token-stage-2 { font-size: 50px; } }

        .status-badge {
            border-radius: 50% !important;
            box-shadow: 0 4px 8px rgba(0,0,0,0.7);
            font-size: 3.5vw;
        }
        @media (min-width: 800px) { .status-badge { font-size: 26px; } }

        .status-fire { background: rgba(220, 38, 38, 0.95) !important; border: 2px solid #f87171 !important; }
        .status-ice { background: rgba(6, 182, 212, 0.95) !important; border: 2px solid #67e8f9 !important; }
        .status-thunder { background: rgba(234, 179, 8, 0.95) !important; border: 2px solid #fde047 !important; color: #000 !important; text-shadow: none !important; }
        .status-water { background: rgba(37, 99, 235, 0.95) !important; border: 2px solid #60a5fa !important; }
        .status-dragon { background: rgba(147, 51, 234, 0.95) !important; border: 2px solid #c084fc !important; }

        .status-para { background: rgba(202, 138, 4, 0.95) !important; border: 2px solid #fef08a !important; color: #000 !important; text-shadow: none !important; }
        .status-blast { background: rgba(194, 65, 12, 0.95) !important; border: 2px solid #ffedd5 !important; }
        .status-sleep { background: rgba(124, 58, 237, 0.95) !important; border: 2px solid #ddd6fe !important; }
        .status-poison { background: rgba(219, 39, 119, 0.95) !important; border: 2px solid #fbcfe8 !important; }
        .status-stun { background: rgba(250, 204, 21, 0.95) !important; border: 2px solid #fef08a !important; color: #000 !important; text-shadow: none !important; }

        /* Modal Styles for Time Deck */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
        }

        .modal-card {
            background: #2a2a2a;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }

        .modal-header h3 { margin: 0; color: #c084fc; }

        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
        }
        .close-btn:hover { color: white; }

        .timedeck-display-img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .discard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding: 5px;
            background: #1a1a1a;
            border-radius: 6px;
        }

        .discard-grid img {
            width: 100%;
            border-radius: 4px;
            border: 1px solid #444;
        }

/* Mobile Landscape Mode Optimization (Side Panel Layout) */
        @media (orientation: landscape) and (max-height: 600px) {
            body {
                padding: 5px 10px;
                margin: 0;
                overflow: hidden;
                height: 100vh;
                flex-direction: row; /* Arranges sidebar and card side-by-side */
                justify-content: center;
                align-items: center;
                gap: 12px;
                box-sizing: border-box;
            }

            /* Displays controls as a left-hand sidebar */
            .panel {
                display: flex !important;
                flex-direction: column;
                width: 170px;
                max-width: 170px;
                max-height: 96vh;
                margin-bottom: 0;
                gap: 8px;
                padding: 8px;
                justify-content: center;
                overflow-y: auto;
            }

            .panel select, .panel button, .panel input {
                width: 100%;
                min-width: 0;
                font-size: 12px;
                padding: 6px;
                box-sizing: border-box;
            }

            #edit-panel {
                width: 150px;
                max-width: 150px;
            }

            /* Fits card height to 96% of the screen */
            #card-container {
                height: 96vh;
                width: auto;
                max-width: none;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #card-image {
                height: 96vh;
                width: auto;
                max-width: none;
            }

            .zone { font-size: 3.5vh; }
            .hp-zone { font-size: 3vh; }
            .token-stage-2 { font-size: 6vh; }
            .status-badge { font-size: 2.8vh; }
        }
    </style>
</head>
<body>

    <div class="panel">
        <select id="monster-select" onchange="onMonsterChange()">
            <option value="">Loading monsters from GitHub...</option>
        </select>
        <select id="card-select" onchange="loadCardImage()">
            <option value="">Select image...</option>
        </select>
        <button class="btn-timedeck" onclick="toggleTimeDeckModal(true)">⏱️ Time Deck</button>
        <button class="btn-edit" onclick="toggleEditMode()">Edit Mode</button>
    </div>

    <div id="edit-panel" class="panel">
        <div class="instruction" id="edit-instruction">Click anywhere to see live coordinates!</div>
        <input type="number" id="edit-max-hp" placeholder="Max HP" onchange="saveMaxHp()">
        <button id="btn-tool-hp" onclick="setPendingAction('hp')">1. Place HP Box</button>
        <button id="btn-tool-token" onclick="setPendingAction('token')">2. Add 'X' Break Box</button>
        <button id="btn-tool-status" onclick="setPendingAction('status')">3. Add Status Counter</button>
        <button class="btn-danger" onclick="clearZones()">Clear Boxes</button>
    </div>

    <div id="card-container" onclick="handleImageClick(event)">
        <img id="card-image" src="" alt="Select a monster card">
        <div id="zones"></div>
    </div>

    <!-- TIME DECK MODAL OVERLAY -->
    <div id="timedeck-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Time Deck Tracker</h3>
                <button class="close-btn" onclick="toggleTimeDeckModal(false)">&times;</button>
            </div>

            <div style="display: flex; gap: 8px; align-items: center;">
                <label for="timedeck-count-input" style="font-size: 13px;">Deck Size:</label>
                <input type="number" id="timedeck-count-input" value="25" min="1" max="100" style="width: 60px;">
                <button onclick="setupNewTimeDeck()" style="background-color: #e69138;">Shuffle & Set Deck</button>
            </div>

            <div style="font-weight: bold; font-size: 14px; text-align: center; color: #ffd966;">
                Cards Left: <span id="deck-remaining-count">0</span> | Discarded: <span id="deck-discarded-count">0</span>
            </div>

            <div id="timedeck-active-card-container">
                <img id="timedeck-active-image" class="timedeck-display-img" src="" style="display: none;" alt="Active Time Card">
                <div id="timedeck-empty-msg" style="text-align: center; padding: 40px 10px; background: #1a1a1a; border-radius: 8px; color: #888;">
                    No card drawn yet. Click "Draw Card" to begin turn.
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <button style="flex: 2; padding: 12px; font-size: 16px;" onclick="drawTimeCard()">🃏 Draw Card</button>
                <button style="flex: 1; background-color: #555;" onclick="toggleDiscardView()">View Discards</button>
            </div>

            <div id="discard-section" style="display: none; flex-direction: column; gap: 6px;">
                <div style="font-size: 13px; font-weight: bold; color: #ccc;">Discarded Cards (Most Recent First):</div>
                <div id="discard-grid" class="discard-grid"></div>
            </div>
        </div>
    </div>

    <script>
        const REPO_OWNER = "BrianAdalid";
        const REPO_NAME = "mh-companion";
        const CARDS_DIR = "Cards";
        const TIME_DECK_DIR = "TimeDeck"; // Root folder for Time Deck

        const defaultStatusZones = [
            { id: 'fire', color: 'fire', x: 4.3, y: 73.6, w: 4.4, h: 6.2 },
            { id: 'ice', color: 'ice', x: 11.1, y: 73.6, w: 4.4, h: 6.2 },
            { id: 'thunder', color: 'thunder', x: 7.7, y: 80.3, w: 4.4, h: 6.2 },
            { id: 'water', color: 'water', x: 4.3, y: 87.0, w: 4.4, h: 6.2 },
            { id: 'dragon', color: 'dragon', x: 11.1, y: 87.0, w: 4.4, h: 6.2 },
            
            { id: 'para', color: 'para', x: 21.8, y: 73.2, w: 4.4, h: 6.2 },
            { id: 'blast', color: 'blast', x: 28.7, y: 73.2, w: 4.4, h: 6.2 },
            { id: 'sleep', color: 'sleep', x: 25.2, y: 79.8, w: 4.4, h: 6.2 },
            { id: 'poison', color: 'poison', x: 21.8, y: 87.0, w: 4.4, h: 6.2 },
            { id: 'stun', color: 'stun', x: 28.7, y: 87.0, w: 4.4, h: 6.2 }
        ];

        let database = JSON.parse(localStorage.getItem('mh_hosted_database')) || {};
        let timeDeckState = JSON.parse(localStorage.getItem('mh_timedeck_state')) || {
            allImages: [],
            drawPile: [],
            discardPile: [],
            currentCard: null
        };

        let currentMonsterKey = '';
        let currentCardKey = '';
        let currentHp = 0;
        let tokenStates = {}; 
        let isEditMode = false;
        let pendingAction = null;

        async function fetchGitHubCached(url) {
            const cached = sessionStorage.getItem(url);
            if (cached) return JSON.parse(cached);
            
            const res = await fetch(url);
            const data = await res.json();
            if (res.ok) sessionStorage.setItem(url, JSON.stringify(data));
            return data;
        }

        async function initApp() {
            const mSelect = document.getElementById('monster-select');
            mSelect.innerHTML = '<option value="">Loading monsters...</option>';

            try {
                // Fetch Monster Folders
                const data = await fetchGitHubCached(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${CARDS_DIR}`);

                if (Array.isArray(data)) {
                    mSelect.innerHTML = '';
                    const folderItems = data.filter(item => item.type === 'dir' && item.name !== 'TimeDeck');
                    
                    folderItems.forEach(item => {
                        const opt = document.createElement('option');
                        opt.value = item.name;
                        opt.textContent = item.name;
                        mSelect.appendChild(opt);
                    });

                    if (folderItems.length > 0) onMonsterChange();
                }
            } catch (err) {
                console.error("Failed to fetch folder list:", err);
                mSelect.innerHTML = '<option value="">Error connecting to GitHub</option>';
            }

            // Initialize Time Deck
            initTimeDeckImages();
        }

        async function onMonsterChange() {
            const mSelect = document.getElementById('monster-select');
            currentMonsterKey = mSelect.value;
            if (!currentMonsterKey) return;

            const cSelect = document.getElementById('card-select');
            cSelect.innerHTML = '<option value="">Loading images...</option>';

            try {
                const data = await fetchGitHubCached(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${CARDS_DIR}/${encodeURIComponent(currentMonsterKey)}`);

                if (Array.isArray(data)) {
                    cSelect.innerHTML = '';
                    const imageFiles = data.filter(item => item.type === 'file' && /\.(jpg|jpeg|png|webp)$/i.test(item.name));
                    
                    imageFiles.forEach(file => {
                        const opt = document.createElement('option');
                        opt.value = file.path;
                        opt.textContent = file.name;
                        cSelect.appendChild(opt);
                    });

                    if (imageFiles.length > 0) loadCardImage();
                }
            } catch (err) {
                cSelect.innerHTML = '';
                loadCardImage();
            }
        }

        function loadCardImage() {
            const cSelect = document.getElementById('card-select');
            currentCardKey = cSelect.value;
            if (!currentCardKey) return;

            document.getElementById('card-image').src = currentCardKey;

            if (!database[currentCardKey]) {
                database[currentCardKey] = {
                    maxHp: 50,
                    hpZone: null,
                    tokenZones: [],
                    statusZones: JSON.parse(JSON.stringify(defaultStatusZones))
                };
                saveDatabase();
            }

            const cardData = database[currentCardKey];
            currentHp = cardData.maxHp;
            document.getElementById('edit-max-hp').value = cardData.maxHp;

            renderZones();
        }

        function renderZones() {
            const container = document.getElementById('zones');
            container.innerHTML = '';
            if (!currentCardKey || !database[currentCardKey]) return;

            const cardData = database[currentCardKey];

            if (cardData.hpZone) {
                const hpDiv = createZoneElement(cardData.hpZone, 'hp');
                hpDiv.id = 'current-hp-display';
                hpDiv.innerText = currentHp;
                if (!isEditMode) hpDiv.onclick = (e) => { e.stopPropagation(); updateHealth(); };
                container.appendChild(hpDiv);
            }

            cardData.tokenZones.forEach(token => {
                const tDiv = createZoneElement(token, 'token');
                const state = tokenStates[token.id] || 0;
                applyTokenStyle(tDiv, state);

                if (!isEditMode) {
                    tDiv.onclick = (e) => { e.stopPropagation(); cycleTokenState(tDiv, token.id); };
                    tDiv.oncontextmenu = (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        tokenStates[token.id] = (tokenStates[token.id] === 10) ? 0 : 10;
                        applyTokenStyle(tDiv, tokenStates[token.id]);
                    };
                }
                container.appendChild(tDiv);
            });

            (cardData.statusZones || []).forEach(statusToken => {
                const sDiv = createZoneElement(statusToken, 'status');
                const state = tokenStates[statusToken.id] || 0;
                applyStatusStyle(sDiv, state, statusToken.color || 'dragon');

                if (!isEditMode) {
                    sDiv.onclick = (e) => { e.stopPropagation(); cycleStatusState(sDiv, statusToken.id); };
                    sDiv.oncontextmenu = (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        tokenStates[statusToken.id] = 0;
                        applyStatusStyle(sDiv, 0, statusToken.color || 'dragon');
                    };
                }
                container.appendChild(sDiv);
            });
        }

        function applyTokenStyle(element, state) {
            element.classList.remove('token-stage-1', 'token-stage-2');
            if (state >= 1 && state <= 9) {
                element.classList.add('token-stage-1');
                element.innerText = state;
            } else if (state === 10) {
                element.classList.add('token-stage-2');
                element.innerText = "X";
            } else {
                element.innerText = "";
            }
        }

        function applyStatusStyle(element, state, color) {
            element.className = 'zone status-badge';
            if (state >= 1 && state <= 9) {
                element.classList.add(`status-${color}`);
                element.innerText = state;
            } else {
                element.innerText = "";
            }
        }

        function cycleTokenState(element, tokenId) {
            let currentState = tokenStates[tokenId] || 0;
            currentState = (currentState + 1) % 11;
            tokenStates[tokenId] = currentState;
            applyTokenStyle(element, currentState);
        }

        function cycleStatusState(element, statusId) {
            let currentState = tokenStates[statusId] || 0;
            currentState = (currentState + 1) % 10;
            tokenStates[statusId] = currentState;
            renderZones();
        }

        function createZoneElement(data, type) {
            const div = document.createElement('div');
            div.className = `zone ${type === 'hp' ? 'hp-zone' : ''}`;
            div.style.left = data.x + '%';
            div.style.top = data.y + '%';
            div.style.width = data.w + '%';
            div.style.height = data.h + '%';
            return div;
        }

        function updateHealth() {
            let input = prompt(`Current HP: ${currentHp}\nEnter damage (or -number to heal):`, "1");
            if (input !== null && !isNaN(input) && input.trim() !== '') {
                currentHp -= parseInt(input);
                if (currentHp < 0) currentHp = 0;
                if (currentHp > database[currentCardKey].maxHp) currentHp = database[currentCardKey].maxHp;
                document.getElementById('current-hp-display').innerText = currentHp;
            }
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            document.body.classList.toggle('edit-active', isEditMode);
            setPendingAction(null);
            renderZones();
        }

        function setPendingAction(action) {
            pendingAction = action;
            const text = document.getElementById('edit-instruction');
            document.getElementById('btn-tool-hp').classList.remove('btn-active-tool');
            document.getElementById('btn-tool-token').classList.remove('btn-active-tool');
            document.getElementById('btn-tool-status').classList.remove('btn-active-tool');

            if (action === 'hp') {
                document.getElementById('btn-tool-hp').classList.add('btn-active-tool');
                text.innerText = "Click image to place HP Box.";
            } else if (action === 'token') {
                document.getElementById('btn-tool-token').classList.add('btn-active-tool');
                text.innerText = "CONTINUOUS MODE: Keep clicking to place multiple 'X' Break Boxes!";
            } else if (action === 'status') {
                document.getElementById('btn-tool-status').classList.add('btn-active-tool');
                text.innerText = "Click to add custom status boxes.";
            } else {
                text.innerText = "Click anywhere to see live coordinates!";
            }
        }

        function handleImageClick(e) {
            if (!isEditMode || !currentCardKey) return;

            const rect = document.getElementById('card-container').getBoundingClientRect();
            const clickX = parseFloat((((e.clientX - rect.left) / rect.width) * 100).toFixed(1));
            const clickY = parseFloat((((e.clientY - rect.top) / rect.height) * 100).toFixed(1));

            document.getElementById('edit-instruction').innerText = `Clicked Position -> x: ${clickX}%, y: ${clickY}%`;

            if (!pendingAction) return;
            const cardData = database[currentCardKey];

            if (pendingAction === 'hp') {
                cardData.hpZone = { x: parseFloat((clickX - 5).toFixed(1)), y: parseFloat((clickY - 7).toFixed(1)), w: 12, h: 17 };
                setPendingAction(null);
            } else if (pendingAction === 'token') {
                cardData.tokenZones.push({
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
                    x: parseFloat((clickX - 5.5).toFixed(1)), 
                    y: parseFloat((clickY - 7.5).toFixed(1)), 
                    w: 11, h: 15
                });
            } else if (pendingAction === 'status') {
                if (!cardData.statusZones) cardData.statusZones = [];
                cardData.statusZones.push({
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
                    color: 'dragon',
                    x: parseFloat((clickX - 2.2).toFixed(1)), 
                    y: parseFloat((clickY - 3.1).toFixed(1)), 
                    w: 4.4, h: 6.2
                });
            }

            saveDatabase();
            renderZones();
        }

        function clearZones() {
            if (confirm("Clear all interaction boxes for this image?")) {
                database[currentCardKey].hpZone = null;
                database[currentCardKey].tokenZones = [];
                database[currentCardKey].statusZones = [];
                saveDatabase();
                renderZones();
            }
        }

        function saveDatabase() {
            localStorage.setItem('mh_hosted_database', JSON.stringify(database));
        }

        /* --- TIME DECK FUNCTIONALITY (RECURSIVE SUPPORT) --- */

        async function initTimeDeckImages() {
            try {
                // Using the Tree API to map the entire repository instantly and find all images deeply nested inside TimeDeck
                const treeData = await fetchGitHubCached(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/main?recursive=1`);
                
                if (treeData && treeData.tree) {
                    timeDeckState.allImages = treeData.tree
                        .filter(item => 
                            item.type === 'blob' && 
                            item.path.startsWith(`${TIME_DECK_DIR}/`) && 
                            /\.(jpg|jpeg|png|webp)$/i.test(item.path)
                        )
                        .map(item => item.path);
                }
            } catch (err) {
                console.error("Failed to load nested Time Deck images:", err);
            }

            if (timeDeckState.drawPile.length === 0 && timeDeckState.discardPile.length === 0 && timeDeckState.allImages.length > 0) {
                setupNewTimeDeck();
            } else {
                renderTimeDeckUI();
            }
        }

        function setupNewTimeDeck() {
            const countInput = parseInt(document.getElementById('timedeck-count-input').value) || 25;
            let pool = [...timeDeckState.allImages];

            if (pool.length === 0) {
                alert("No images found in the TimeDeck folder yet! Please push them to GitHub.");
                return;
            }
            
            // Fisher-Yates Shuffle
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            // Trim deck to requested size
            timeDeckState.drawPile = pool.slice(0, countInput);
            timeDeckState.discardPile = [];
            timeDeckState.currentCard = null;

            saveTimeDeckState();
            renderTimeDeckUI();
        }

        function drawTimeCard() {
            if (timeDeckState.drawPile.length === 0) {
                alert("The Time Deck is empty! All cards have been drawn.");
                return;
            }

            const drawnCard = timeDeckState.drawPile.pop();
            timeDeckState.discardPile.unshift(drawnCard);
            timeDeckState.currentCard = drawnCard;

            saveTimeDeckState();
            renderTimeDeckUI();
        }

        function renderTimeDeckUI() {
            document.getElementById('deck-remaining-count').innerText = timeDeckState.drawPile.length;
            document.getElementById('deck-discarded-count').innerText = timeDeckState.discardPile.length;

            const activeImg = document.getElementById('timedeck-active-image');
            const placeholder = document.getElementById('timedeck-empty-msg');

            if (timeDeckState.currentCard) {
                activeImg.src = timeDeckState.currentCard;
                activeImg.style.display = 'block';
                placeholder.style.display = 'none';
            } else {
                activeImg.style.display = 'none';
                placeholder.style.display = 'block';
            }

            const grid = document.getElementById('discard-grid');
            grid.innerHTML = '';
            timeDeckState.discardPile.forEach(imgPath => {
                const img = document.createElement('img');
                img.src = imgPath;
                grid.appendChild(img);
            });
        }

        function toggleTimeDeckModal(show) {
            document.getElementById('timedeck-modal').style.display = show ? 'flex' : 'none';
        }

        function toggleDiscardView() {
            const section = document.getElementById('discard-section');
            section.style.display = section.style.display === 'none' ? 'flex' : 'none';
        }

        function saveTimeDeckState() {
            localStorage.setItem('mh_timedeck_state', JSON.stringify(timeDeckState));
        }

        window.onload = initApp;
    </script>
</body>
</html>
